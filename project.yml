name: Dibsly
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Dibsly:
    type: application
    platform: iOS
    sources:
      - path: Dibsly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Dibsly
        PRODUCT_NAME: Dibsly
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dibsly
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dibsly uses your location to show free stuff posted near you. Only a coarse neighborhood grid is ever saved."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take photos of the item you are giving away so neighbors can see what they are claiming."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick photos of the item you are giving away or upload a photo for a Wanted request."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIBackgroundModes: remote-notification
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        CODE_SIGN_ENTITLEMENTS: Dibsly/Dibsly.entitlements
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: GLMProxySecret.txt
          EXCLUDED_RESOURCE_FILE_NAMES: GLMProxySecret.txt
    entitlements:
      path: Dibsly/Dibsly.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.zzoutuo.Dibsly
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.zzoutuo.Dibsly"

  DibslyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DibslyUITests
    dependencies:
      - target: Dibsly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.DibslyUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Dibsly

  DibslyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DibslyTests
    dependencies:
      - target: Dibsly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.DibslyTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Dibsly:
    build:
      targets:
        Dibsly: all
        DibslyUITests: [test]
        DibslyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DibslyTests
        - DibslyUITests
    archive:
      config: Release
